name: flight-delay-ai

services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - flight-delay-network

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "10m"
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          OLLAMA_HOST=http://127.0.0.1:11434
          ollama list
          > /dev/null 2>&1
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - flight-delay-network

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b-instruct}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        echo "Preparing Ollama model: $${OLLAMA_MODEL}"
        ollama pull "$${OLLAMA_MODEL}"
        ollama show "$${OLLAMA_MODEL}" > /dev/null
        echo "Ollama model is ready: $${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - flight-delay-network

  backend:
    image: ${BACKEND_REF:-flight-delay-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      PORT: "5000"
      FLASK_DEBUG: "false"
      API_V1_STR: "/api/v1"
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-me}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      MODEL_PATH: "/app/ml/models/v1_model.json"
      FLIGHT_DATA_PATH: "/app/datasets/flight_data.csv"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DATABASE_URL: "sqlite:////app/data/flight_delay.db"
      SQLALCHEMY_DATABASE_URI: "sqlite:////app/data/flight_delay.db"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b-instruct}
      DEFAULT_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b-instruct}
    command:
      - python
      - run.py
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:5000/health
          > /dev/null
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - flight-delay-network

  analytics:
    image: ${BACKEND_REF:-flight-delay-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      FLASK_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-me}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      MODEL_PATH: "/app/ml/models/v1_model.json"
      FLIGHT_DATA_PATH: "/app/datasets/flight_data.csv"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DATABASE_URL: "sqlite:////app/data/flight_delay.db"
      SQLALCHEMY_DATABASE_URI: "sqlite:////app/data/flight_delay.db"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b-instruct}
      DEFAULT_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b-instruct}
    command:
      - python
      - analytics.py
    ports:
      - "${ANALYTICS_HOST_PORT:-8050}:8050"
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:8050/
          > /dev/null
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - flight-delay-network

  frontend:
    image: ${FRONTEND_REF:-flight-delay-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget
          --quiet
          --tries=1
          --output-document=/dev/null
          http://127.0.0.1/health
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - flight-delay-network


volumes:
  backend_data:
  redis_data:
  ollama_models:
    external: true
    name: ${OLLAMA_MODELS_VOLUME:-flight-delay-ollama-models}

networks:
  flight-delay-network:
    driver: bridge
