services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SONAR_DB_NAME}
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}

    volumes:
      - sonarqube_database:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SONAR_DB_USER} -d ${SONAR_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://database:5432/${SONAR_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}

    ports:
      - "9000:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  sonarqube_database:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
